<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ingresar · Casa Muladhara</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff}
body{font-family:"Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(255,255,255,.1)}

#particles{position:fixed;inset:0;z-index:10;pointer-events:none;width:100%;height:100%}
.page{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;overflow-y:auto;padding:max(32px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.wrap{position:relative;z-index:20;width:100%;max-width:56rem;margin:auto;padding:16px 0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen{width:100%;display:flex;flex-direction:column;align-items:center;animation:in .45s ease both}
.screen[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes word{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
.w{display:inline-block;opacity:0;animation:word .7s ease-out forwards}
.words{display:flex;flex-wrap:wrap;justify-content:center;column-gap:.25em}

/* pantalla de opciones */
.hero{text-align:center;max-width:56rem;margin-bottom:32px}
.hero h1{margin:0;padding:0 16px;font-weight:300;font-size:clamp(1.875rem,5vw,3rem);line-height:1.15;letter-spacing:-.025em}
.hero p{margin:16px 0 0;color:#9ca3af;font-weight:300;font-size:.75rem;letter-spacing:.025em;text-transform:uppercase}
@media(min-width:768px){.hero{margin-bottom:48px}.hero p{font-size:.875rem}}
.opt{width:100%;max-width:24rem;height:56px;margin-bottom:16px;border-radius:9999px;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;font-weight:300;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 10px 15px -3px rgba(0,0,0,.4);transition:transform .3s,background .3s,border-color .3s}
@media(min-width:768px){.opt{font-size:.875rem}}
.opt:hover{background:linear-gradient(to right,#2d1b4e,#9b4dca);border-color:#2d1b4e;transform:scale(1.05)}
.opt:active{transform:scale(.95)}
.back-site{background:none;border:0;padding:8px 0;margin-top:24px;color:rgba(255,255,255,.5);font-weight:600;font-size:.625rem;letter-spacing:.3em;text-transform:uppercase;text-decoration:none;transition:color .2s}
.back-site:hover{color:#fff}
@media(min-width:768px){.back-site{font-size:.75rem}}

/* formulario */
.form-screen{max-width:42rem;padding:0 8px;gap:24px}
@media(min-width:640px){.form-screen{padding:0 16px}}
.switch{display:flex;width:100%;max-width:20rem;padding:4px;margin:0 auto 8px;border-radius:9999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.switch button{flex:1;padding:8px 12px;border:0;border-radius:9999px;background:transparent;color:rgba(255,255,255,.6);font-size:.75rem;font-weight:500;transition:all .2s}
.switch button:hover{color:#fff}
.switch button[aria-pressed="true"]{background:#fff;color:#000;font-weight:600;box-shadow:0 4px 6px -1px rgba(0,0,0,.4)}
.titles{display:flex;flex-direction:column;gap:8px;justify-content:center;text-align:center;max-width:42rem;padding:0 16px;min-height:4.5rem;margin-bottom:16px}
@media(min-width:640px){.titles{min-height:6rem}}
.titles .words{row-gap:4px;font-weight:300;letter-spacing:.025em}
.titles .l0{color:rgba(255,255,255,.9);font-size:1.25rem}
.titles .l1{color:rgba(255,255,255,.6);font-size:.875rem}
@media(min-width:640px){.titles .l0{font-size:1.5rem}.titles .l1{font-size:1rem}}
@media(min-width:768px){.titles .l0{font-size:1.875rem}.titles .l1{font-size:1.125rem}}
form{width:100%;max-width:24rem;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.in{width:100%;height:48px;padding:0 24px;border-radius:9999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:.875rem;letter-spacing:.025em;text-align:center;outline:0;transition:border-color .2s}
.in::placeholder{color:rgba(255,255,255,.3)}
.in:focus{border-color:rgba(255,255,255,.4)}
.in:-webkit-autofill{-webkit-text-fill-color:#fff;box-shadow:0 0 0 100px #0e0e10 inset}
.go{width:100%;height:48px;margin-top:8px;border:0;border-radius:9999px;background:#fff;color:#000;font-weight:600;font-size:.875rem;letter-spacing:.05em;box-shadow:0 10px 15px -3px rgba(0,0,0,.4);transition:all .3s}
.go:hover{background:rgba(255,255,255,.9)}
.go:active{transform:scale(.95)}
.go:disabled,.soc:disabled{opacity:.5;cursor:default}
.forgot{align-self:center;background:none;border:0;padding:2px 8px;color:rgba(255,255,255,.4);font-size:.6875rem;letter-spacing:.08em;transition:color .2s}
.forgot:hover{color:#fff}
.or{display:flex;align-items:center;width:100%;max-width:24rem;margin:0 auto;padding:8px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid rgba(255,255,255,.1)}
.or span{margin:0 16px;color:rgba(255,255,255,.4);font-size:.625rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.soc{height:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:.75rem;font-weight:500;white-space:nowrap;transition:all .2s}
.soc:hover{background:rgba(255,255,255,.1)}
.soc:active{transform:scale(.95)}
.back-opts{margin:0 auto;padding:8px 16px;background:none;border:0;color:rgba(255,255,255,.5);font-size:.75rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;transition:color .2s}
.back-opts:hover{color:#fff}
.brand{position:relative;z-index:10;margin:32px 0 16px;text-align:center;font-size:.5625rem;letter-spacing:.6em;text-transform:uppercase;color:rgba(255,255,255,.4);white-space:nowrap;opacity:0;animation:fade 1s 1s forwards}
@keyframes fade{to{opacity:.3}}

/* aviso */
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;max-width:min(92vw,28rem);padding:12px 18px;border-radius:14px;background:#18181b;border:1px solid rgba(255,255,255,.12);color:#fff;font-size:.8125rem;line-height:1.4;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.toast.err{border-color:rgba(248,113,113,.5)}
.toast[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.w,.screen{animation:none;opacity:1;transform:none;filter:none}.brand{animation:none;opacity:.3}}
</style>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>

<div class="page">
  <div class="wrap">

    <section class="screen" id="screen-options">
      <div class="hero">
        <h1 class="words" id="hero-title"></h1>
        <p class="words" id="hero-sub"></p>
      </div>
      <button class="opt" type="button" id="opt-register">Comenzar en Casa Muladhara</button>
      <button class="opt" type="button" id="opt-login">Ya tengo mi cuenta en Casa Muladhara</button>
      <a class="back-site" href="index.html">Volver a la página principal</a>
    </section>

    <section class="screen form-screen" id="screen-form" hidden>
      <div class="switch" role="group" aria-label="Modo">
        <button type="button" id="sw-login" aria-pressed="true">Iniciar Sesión</button>
        <button type="button" id="sw-register" aria-pressed="false">Crear Cuenta</button>
      </div>

      <div class="titles" id="titles" aria-live="polite"></div>

      <form id="auth-form" novalidate>
        <input class="in" type="email" id="email" placeholder="Correo electrónico" autocomplete="email" required>
        <input class="in" type="password" id="password" placeholder="Contraseña" autocomplete="current-password" minlength="6" required>
        <button class="go" type="submit" id="submit">Iniciar Sesión</button>
        <button class="forgot" type="button" id="forgot">¿Olvidaste tu contraseña?</button>
      </form>

      <div class="or"><span>O continuar con</span></div>

      <div class="socials">
        <button class="soc" type="button" id="google">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="16" height="16" aria-hidden="true"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
          Google
        </button>
      </div>

      <button class="back-opts" type="button" id="back-opts">← Volver a opciones</button>
    </section>

  </div>
  <div class="brand">Casa Muladhara · Aula virtual</div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
/* Partículas de fondo (mismas que Udreamms: 450 puntos violetas a la deriva) */
(function(){
  const cv=document.getElementById('particles'),ctx=cv.getContext('2d',{alpha:true});
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ps=[];
  const size=()=>{cv.width=innerWidth;cv.height=innerHeight};
  addEventListener('resize',size);size();
  const N=innerWidth<640?220:450;
  ps=Array.from({length:N},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,s:Math.random()*1.5+.5,seed:Math.random()}));
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    const t=Date.now()*.001;
    for(const p of ps){
      if(!reduce){p.x+=p.vx+Math.sin(t+p.seed*10)*.2;p.y+=p.vy+Math.cos(t+p.seed*10)*.2}
      if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;
      ctx.fillStyle='rgba(168,85,247,'+(.1+p.seed*.3)+')';
      ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();
    }
    requestAnimationFrame(tick);
  })();
})();
</script>

<script type="module">
import { auth } from './assets/js/firebase.js';
import { PREVIEW } from './assets/js/preview.js';
import { signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider,
  sendPasswordResetEmail, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
// Solo se permite volver a páginas internas conocidas (evita redirecciones abiertas)
const NEXT = ['aula.html'].includes(params.get('next')) ? params.get('next') : 'aula.html';

let registering = false, busy = false, tt;

function say(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 5000);
}
function words(el, text, delay0 = 0, step = .1) {
  el.textContent = '';
  text.split(' ').forEach((w, i) => {
    const s = document.createElement('span'); s.className = 'w'; s.textContent = w;
    s.style.animationDelay = (delay0 + i * step) + 's'; el.appendChild(s);
  });
}
function lines(arr) {
  const box = $('#titles'); box.textContent = '';
  arr.forEach((txt, li) => {
    const d = document.createElement('div'); d.className = 'words l' + li; box.appendChild(d);
    words(d, txt, .15 + li * .5, .08);
  });
}
function setMode(reg) {
  registering = reg;
  $('#sw-login').setAttribute('aria-pressed', !reg);
  $('#sw-register').setAttribute('aria-pressed', reg);
  $('#submit').textContent = reg ? 'Registrarse en Casa Muladhara' : 'Iniciar Sesión';
  $('#password').autocomplete = reg ? 'new-password' : 'current-password';
  $('#forgot').hidden = reg;
  lines(reg
    ? ['Tu camino comienza hoy en Casa Muladhara', 'Crea tu cuenta para comenzar']
    : ['¡Te damos la bienvenida de nuevo!', 'Inicia sesión con tu cuenta para continuar']);
}
function showForm(reg) {
  $('#screen-options').hidden = true; $('#screen-form').hidden = false; setMode(reg);
}
function showOptions() { $('#screen-form').hidden = true; $('#screen-options').hidden = false; }

words($('#hero-title'), 'Bienvenido a Casa Muladhara', .2, .1);
words($('#hero-sub'), 'Elige cómo deseas ingresar', 1, .1);

$('#opt-register').onclick = () => showForm(true);
$('#opt-login').onclick = () => showForm(false);
$('#sw-login').onclick = () => setMode(false);
$('#sw-register').onclick = () => setMode(true);
$('#back-opts').onclick = showOptions;

if (params.get('register') === 'true') showForm(true);
else if (params.get('mode') === 'login') showForm(false);
if (params.get('email')) $('#email').value = params.get('email');

const ERR = {
  'auth/invalid-credential': 'Correo o contraseña incorrectos.',
  'auth/invalid-email': 'Escribe un correo válido.',
  'auth/user-not-found': 'No encontramos una cuenta con ese correo.',
  'auth/wrong-password': 'Correo o contraseña incorrectos.',
  'auth/email-already-in-use': 'Ese correo ya tiene una cuenta. Prueba iniciar sesión.',
  'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
  'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.',
  'auth/network-request-failed': 'Sin conexión. Revisa tu internet e inténtalo de nuevo.',
  'auth/popup-closed-by-user': 'Cerraste la ventana de Google antes de terminar.',
  'auth/cancelled-popup-request': 'Cerraste la ventana de Google antes de terminar.',
  'auth/popup-blocked': 'Tu navegador bloqueó la ventana de Google. Permite las ventanas emergentes e inténtalo otra vez.',
  'auth/unauthorized-domain': 'Este dominio aún no está autorizado para iniciar sesión.',
  'auth/user-disabled': 'Esta cuenta está deshabilitada. Escríbenos para ayudarte.',
};
const msg = (e) => ERR[e.code] || 'No pudimos completar la acción. Inténtalo de nuevo.';
function lock(v) { busy = v; $('#submit').disabled = v; $('#google').disabled = v; }

let leaving = false;
function go() { if (!leaving) { leaving = true; location.replace(NEXT); } }

$('#auth-form').onsubmit = async (e) => {
  e.preventDefault(); if (busy) return;
  const email = $('#email').value.trim(), pass = $('#password').value;
  if (PREVIEW) return go(); // vista previa de la rama valentina: entra sin iniciar sesión
  if (!email || !pass) return say('Escribe tu correo y contraseña.', true);
  lock(true); $('#submit').textContent = 'Sincronizando...';
  try {
    registering ? await createUserWithEmailAndPassword(auth, email, pass) : await signInWithEmailAndPassword(auth, email, pass);
    go();
  } catch (err) { say(msg(err), true); }
  finally { lock(false); setMode(registering); }
};

$('#google').onclick = async () => {
  if (busy) return;
  if (PREVIEW) return go(); // vista previa de la rama valentina: entra sin iniciar sesión
  lock(true);
  try { await signInWithPopup(auth, new GoogleAuthProvider()); go(); }
  catch (err) { say(msg(err), true); }
  finally { lock(false); }
};

$('#forgot').onclick = async () => {
  const email = $('#email').value.trim();
  if (!email) return say('Escribe tu correo arriba y vuelve a tocar “¿Olvidaste tu contraseña?”.', true);
  try { await sendPasswordResetEmail(auth, email); } catch (err) { if (err.code !== 'auth/user-not-found') return say(msg(err), true); }
  say('Si ese correo tiene una cuenta, te enviamos un enlace para crear una nueva contraseña.');
};

// Si ya hay una sesión abierta, entra directo al aula
onAuthStateChanged(auth, (u) => { if (u) go(); });
</script>
</body>
</html>
