<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Aula · Casa Muladhara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Josefin+Sans:wght@300;400;600&family=Mulish:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* Layout: an app shell. Deep-green sidebar (brand chrome, same in both themes) + linen work area; each section is a view swapped in place */
:root{
  --forest:#2b5443;--forest-deep:#1f3f32;--linen:#e9e4d0;
  --bg:#f6f4ec;--surface:#fffdf6;--surface-2:#f0ede1;--fg:#22302a;--muted:#5d6b63;--line:#d9d5c3;
  --brass:#a77a3b;--sun:#f2c66d;--accent:#2b5443;--accent-fg:#ece7d3;
  --on-brand:#ece7d3;--on-brand-muted:#b9c4b5;
  --ok:#3f7d5c;--live:#d4614c;
  --shadow:0 1px 2px rgba(31,63,50,.06),0 12px 30px -16px rgba(31,63,50,.3);
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-caps:"Josefin Sans","Futura","Century Gothic",system-ui,sans-serif;
  --f-body:"Mulish","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141c18;--surface:#1b2520;--surface-2:#202c26;--fg:#e8e4d4;--muted:#a3ada2;--line:#2e3a33;
  --brass:#d2a565;--sun:#e8bd63;--accent:#e8bd63;--accent-fg:#1f3f32;--forest-deep:#16291f;--ok:#7fbf98;--live:#ef8a73;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141c18;--surface:#1b2520;--surface-2:#202c26;--fg:#e8e4d4;--muted:#a3ada2;--line:#2e3a33;
  --brass:#d2a565;--sun:#e8bd63;--accent:#e8bd63;--accent-fg:#1f3f32;--forest-deep:#16291f;--ok:#7fbf98;--live:#ef8a73;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.eyebrow{font:600 .7rem/1 var(--f-caps);letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:600 .74rem/1 var(--f-caps);letter-spacing:.14em;text-transform:uppercase;padding:.95em 1.4em;border-radius:999px;border:1px solid transparent;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-sm{padding:.75em 1.1em;font-size:.66rem}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 .6rem/1 var(--f-caps);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.pres{background:var(--sun);color:#1f3f32}
.pill.live{border:1px solid var(--line);color:var(--fg)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live)}
.pill.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.prog{background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass)}
.pill.lock{background:var(--surface-2);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s}

/* shell */
.ribbon{background:var(--brass);color:#fff;text-align:center;font:600 .64rem/1 var(--f-caps);letter-spacing:.2em;text-transform:uppercase;padding:8px 16px}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{background:var(--forest-deep);color:var(--on-brand);display:flex;flex-direction:column;gap:6px;padding:22px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(236,231,211,.12);margin-bottom:12px}
.brand svg{width:40px;height:40px;color:var(--on-brand);flex-shrink:0}
.brand b{display:block;font:400 .9rem/1 var(--f-caps);letter-spacing:.2em}
.brand small{display:block;font:300 .54rem/1 var(--f-caps);letter-spacing:.36em;color:var(--on-brand-muted);margin-top:6px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:11px 12px;border-radius:12px;text-align:left;font:400 .9rem/1.2 var(--f-body);color:var(--on-brand-muted)}
.nav button svg{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(236,231,211,.06);color:var(--on-brand)}
.nav button[aria-current="page"]{background:rgba(242,198,109,.14);color:var(--on-brand)}
.nav button[aria-current="page"] svg{stroke:#f2c66d}
.nav .count{margin-left:auto;font:700 .66rem/1 var(--f-body);background:#f2c66d;color:#1f3f32;border-radius:999px;padding:4px 7px}
.nav-label{font:600 .58rem/1 var(--f-caps);letter-spacing:.26em;text-transform:uppercase;color:rgba(236,231,211,.45);padding:18px 12px 8px}
.side-foot{margin-top:auto;padding:16px 12px 4px;border-top:1px solid rgba(236,231,211,.12);display:flex;align-items:center;gap:10px}
.side-foot .who b{display:block;font-size:.88rem;font-weight:700}
.side-foot .who small{color:var(--on-brand-muted);font-size:.74rem}

.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 .8rem/1 var(--f-body);color:#1f3f32;background:var(--c,#f2c66d);flex-shrink:0}
.av.sm{width:32px;height:32px;font-size:.72rem}
.av.karen{background:#1f3f32;color:#f2c66d;border:1.5px solid #f2c66d}
.nav button.locked{opacity:.55;cursor:not-allowed}
.nav button .lock{width:15px;height:15px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.av.ph{background-size:cover;background-position:center;background-repeat:no-repeat;color:transparent}
.side-foot.edit{cursor:pointer;border-radius:12px;transition:background .15s}
.side-foot.edit:hover{background:rgba(236,231,211,.08)}
.side-foot .edit-hint{display:block;color:var(--on-brand-muted);font-size:.7rem;text-decoration:underline;text-underline-offset:2px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,36px)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.8;flex-shrink:0}
.search input[type=text]{flex:1;min-width:0;border:0;border-radius:0;background:transparent;font:inherit;color:var(--fg);padding:10px 0}
.search input:focus-visible{outline:none}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.ibtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--live);border:2px solid var(--surface)}
.menu-btn{display:none}
.view{padding:clamp(20px,3vw,36px);padding-bottom:64px;display:grid;gap:28px;max-width:1240px;width:100%}
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.view-head h1{font-size:clamp(1.8rem,3.4vw,2.5rem);margin-top:10px}
.view-head p{color:var(--muted);max-width:40em;margin-top:6px}

/* notifications */
.pop{position:absolute;right:clamp(16px,3vw,36px);top:62px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:30;overflow:hidden}
.pop h4{font:600 .66rem/1 var(--f-caps);letter-spacing:.2em;text-transform:uppercase;padding:16px 18px;border-bottom:1px solid var(--line);color:var(--muted)}
.pop li{list-style:none;display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:.86rem}
.pop ul{margin:0;padding:0}
.pop li small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:40;transform:translateX(-102%);transition:transform .25s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.35)}
  .menu-btn{display:grid}
  .scrim-side{position:fixed;inset:0;background:rgba(10,20,16,.5);z-index:35}
}

/* home */
.hero{border-radius:24px;background:radial-gradient(120% 120% at 90% 0%,#386650 0%,#2b5443 45%,#1f3f32 100%);color:var(--on-brand);padding:clamp(24px,4vw,40px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;position:relative;overflow:hidden}
.hero .motif{position:absolute;right:-80px;bottom:-120px;width:380px;height:380px;opacity:.08;color:var(--on-brand);pointer-events:none}
.hero h2{font-size:clamp(1.7rem,3.2vw,2.3rem);margin-block:12px 10px}
.hero p{color:var(--on-brand-muted);max-width:32em}
.hero .eyebrow{color:#f2c66d}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.hero .btn-primary{background:#e9e4d0;color:#1f3f32}
.hero .btn-ghost{border-color:rgba(236,231,211,.4);color:var(--on-brand)}
.ring-wrap{display:grid;place-items:center;gap:12px;text-align:center;position:relative}
.ring-wrap svg.ring{width:170px;height:170px}
.ring-wrap .lbl{font:600 .64rem/1.4 var(--f-caps);letter-spacing:.18em;text-transform:uppercase;color:var(--on-brand-muted)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.ring-wrap{order:-1;justify-items:start;text-align:left;grid-template-columns:auto 1fr;align-items:center}.ring-wrap svg.ring{width:110px;height:110px}}

.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.9fr);gap:10px}
.lvl{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:18px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-width:0;transition:transform .15s,border-color .15s}
.lvl:hover{transform:translateY(-2px);border-color:var(--brass)}
.lvl:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.lvl .n{font:400 2rem/1 var(--f-display);color:var(--brass)}
.lvl h3{font-size:1.05rem;line-height:1.25}
.lvl .meta{font-size:.76rem;color:var(--muted);margin-top:auto}
.lvl.locked{opacity:.72}
.lvl.summit{background:var(--forest-deep);color:var(--on-brand);border-color:#f2c66d;align-items:center;text-align:center;justify-content:center}
.lvl.summit h3{font-size:1rem}
.lvl.summit small{font:600 .58rem/1.3 var(--f-caps);letter-spacing:.16em;text-transform:uppercase;color:#f2c66d}
.lvl.summit svg{width:58px;height:58px}
@media (max-width:1100px){.path{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.path{grid-template-columns:1fr 1fr}}
@media (max-width:400px){.path{grid-template-columns:1fr}}

.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.panel{padding:22px;display:grid;gap:16px;align-content:start}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-h h3{font-size:1.25rem}
.link{background:none;border:0;padding:0;font:600 .66rem/1 var(--f-caps);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.next-class{display:flex;gap:16px;align-items:center;padding:16px;border-radius:14px;background:var(--linen);color:#22302a}
.date{min-width:56px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.date b{display:block;font:400 1.7rem/1 var(--f-display)}
.date small{font:600 .6rem/1 var(--f-caps);letter-spacing:.14em;text-transform:uppercase}
.next-class .t{flex:1;min-width:0}
.next-class .t b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.next-class .t span{font-size:.84rem;color:#4d5b53}
.next-class .btn{background:#2b5443;color:#ece7d3}
.mini-post{display:flex;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.mini-post:first-of-type{border-top:0;padding-top:0}
.mini-post b{font-size:.88rem}
.mini-post p{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge-row{display:flex;gap:12px;flex-wrap:wrap}
.badge-row svg{width:64px;height:64px}

/* course */
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.course{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
@media (max-width:1100px){.course{grid-template-columns:1fr}}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:20px;overflow:hidden;background:radial-gradient(130% 120% at 70% 20%,#3d6c56 0%,#244a3a 50%,#152b21 100%);color:#ece7d3;display:grid;place-items:center}
.player .motif{position:absolute;width:62%;height:auto;aspect-ratio:1;opacity:.1;color:#ece7d3}
.player .cap{position:absolute;left:20px;top:18px;right:20px;display:flex;justify-content:space-between;gap:10px;align-items:start}
.player .cap b{font:400 clamp(1rem,2.4vw,1.5rem)/1.2 var(--f-display);max-width:24em}
.player .cap small{display:block;font:600 .6rem/1 var(--f-caps);letter-spacing:.2em;text-transform:uppercase;color:#f2c66d;margin-bottom:8px}
.play{position:relative;width:78px;height:78px;border-radius:50%;border:0;background:rgba(236,231,211,.92);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .15s}
.play:hover{transform:scale(1.05)}
.play svg{width:28px;height:28px;fill:#1f3f32}
.controls{position:absolute;left:0;right:0;bottom:0;padding:30px 18px 14px;background:linear-gradient(transparent,rgba(10,20,16,.75));display:flex;align-items:center;gap:12px;font-size:.78rem;font-variant-numeric:tabular-nums}
.controls .track{flex:1;height:5px;background:rgba(236,231,211,.25);border-radius:999px;position:relative;cursor:pointer}
.controls .track i{position:absolute;inset:0 auto 0 0;background:#f2c66d;border-radius:inherit}
.controls .track span{position:absolute;top:-3px;width:2px;height:11px;background:rgba(236,231,211,.6)}
.controls button{background:none;border:0;color:#ece7d3;padding:2px;display:grid}
.controls button svg{width:18px;height:18px;fill:currentColor}
.chapter-now{position:absolute;left:18px;bottom:46px;font:600 .62rem/1 var(--f-caps);letter-spacing:.16em;text-transform:uppercase;background:rgba(10,20,16,.55);padding:7px 10px;border-radius:999px}

.lesson-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:start}
.lesson-head h2{font-size:clamp(1.4rem,2.6vw,1.9rem);margin-top:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;font:600 .68rem/1 var(--f-caps);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--brass)}
.chapters{list-style:none;margin:0;padding:0;display:grid}
.chapters li button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.chapters li button:hover .ct{color:var(--brass)}
.chapters li button:focus-visible{outline:2px solid var(--brass)}
.chapters .ts{font:600 .78rem/1.5 var(--f-body);color:var(--brass);font-variant-numeric:tabular-nums}
.chapters .ct{font-weight:700;font-size:.94rem}
.chapters .cd{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.chapters li.now .ct{color:var(--brass)}
.files{display:grid;gap:10px}
.file{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.ficon{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font:700 .62rem/1 var(--f-caps);letter-spacing:.06em;flex-shrink:0;color:#1f3f32}
.ficon.pdf{background:#efd3c3}.ficon.mp3{background:#d6e4cf}.ficon.mp4{background:#d4dcea}.ficon.doc{background:#f2e1b5}
.file .fx{flex:1;min-width:0}
.file .fx b{display:block;font-size:.92rem}
.file .fx small{color:var(--muted);font-size:.78rem}
textarea,input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],input[type=datetime-local],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
textarea{min-height:140px;resize:vertical}
.qa{display:grid;gap:14px}
.q{display:flex;gap:12px}
.q .bubble{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px}
.q .bubble b{font-size:.86rem}
.q .bubble p{font-size:.9rem;margin-top:4px}
.q.reply{margin-left:44px}
.q.reply .bubble{background:color-mix(in srgb,var(--sun) 12%,var(--surface))}
.tag-k{font:700 .56rem/1 var(--f-caps);letter-spacing:.14em;text-transform:uppercase;background:#1f3f32;color:#f2c66d;padding:4px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}

.syllabus{padding:0;overflow:hidden;position:sticky;top:84px}
@media (max-width:1100px){.syllabus{position:static}}
.syl-top{padding:20px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.syl-top h3{font-size:1.2rem}
.syl-top .row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mod{border-bottom:1px solid var(--line)}
.mod:last-child{border-bottom:0}
.mod-h{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface-2)}
.mod-h:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.mod-h b{flex:1;font-size:.92rem;font-weight:700}
.mod-h small{color:var(--muted);font-size:.76rem;white-space:nowrap}
.mod-h svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .2s;flex-shrink:0}
.mod-h[aria-expanded="true"] svg{transform:rotate(180deg)}
.les{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 20px;font-size:.88rem}

.deck{border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.deck.enter .dk-body>*{animation:dkIn .5s both}
.deck.enter .dk-body>*:nth-child(2){animation-delay:.08s}
.deck.enter .dk-body>*:nth-child(3){animation-delay:.16s}

.dk-hero h2{font-size:clamp(2.1rem,5.4vw,3.8rem);line-height:1.05;margin:0}
.dk-hero p{color:#b9c4b5;max-width:32em;font-size:1.08rem}
.dk-hero .dk-sig{font:600 .62rem/1 var(--f-caps);letter-spacing:.3em;text-transform:uppercase;color:#f2c66d;margin-top:6px}
.dk-hero .tg{background:rgba(236,231,211,.1);border-color:rgba(236,231,211,.28);color:#ece7d3}
.dk-hero.light{background:var(--linen);color:#22302a}
.dk-hero.light p{color:#4d5b53}.dk-hero.light .eyebrow{color:#8a6430}.dk-hero.light .mo{color:#2b5443;opacity:.07}
.dk-chips{display:flex;flex-wrap:wrap;gap:8px}
.tg{font-size:.86rem;padding:7px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px}
.tg i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.dk-grid{display:grid;gap:12px}
.dk-grid.c4{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.dk-grid.c3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.dk-grid.c2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.dk-split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:30px;align-items:center}
@media (max-width:760px){.dk-split{grid-template-columns:1fr}}
.ic{stroke:currentColor;flex-shrink:0}
.pill-card{display:grid;gap:10px;align-content:start;padding:18px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.pill-card .ic{color:var(--brass)}
.pill-card b{font:400 1.15rem/1.2 var(--f-display)}
.pill-card p{font-size:.9rem;color:var(--muted)}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.rt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.rt:hover{border-color:var(--brass)}.rt:focus-visible{outline:2px solid var(--brass)}
.rt b{width:30px;height:30px;border-radius:50%;background:var(--forest);color:#f2c66d;display:grid;place-items:center;font:400 1rem/1 var(--f-display);flex-shrink:0}
.rt span{font-size:.88rem;line-height:1.3}
.dk-quote{font:400 clamp(1.25rem,2.4vw,1.7rem)/1.5 var(--f-display);max-width:34em}
.dk-quote mark{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--sun) 55%,transparent) 62%);color:inherit;padding:0 2px}
.dk-call{padding:16px 20px;border-radius:14px;border-left:3px solid var(--brass);background:var(--surface-2);font-size:.96rem}
.dk-call b{color:var(--brass)}
.dk-call.warn{background:color-mix(in srgb,var(--sun) 18%,var(--surface));border-color:var(--sun)}
.dk-note{font-size:.8rem;color:var(--muted)}
/* tarjetas que se voltean */
.flip{all:unset;box-sizing:border-box;cursor:pointer;display:block;perspective:900px;height:210px}
.flip:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:16px}
.flip>span{display:block;position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on>span{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:18px;display:grid;align-content:center;justify-items:start;gap:10px;border:1px solid var(--line)}
.flip .f{background:var(--surface-2)}
.flip .f .ic{color:var(--brass)}
.flip .f b{font:400 1.3rem/1.2 var(--f-display)}
.flip .f em{font:600 .58rem/1 var(--f-caps);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-style:normal;margin-top:4px}
.flip .b{background:var(--forest-deep);color:#ece7d3;transform:rotateY(180deg);font-size:.92rem;border-color:#f2c66d}
.flip.heb .f{justify-items:center;text-align:center;background:var(--surface)}
.flip.heb .f .h{font:400 2.4rem/1.1 "Times New Roman","Noto Serif Hebrew","David",serif;direction:rtl;color:var(--fg)}
.flip.heb .b{justify-items:center;text-align:center}
.flip.heb .b b{font:400 1.35rem/1.2 var(--f-display);color:#f2c66d}
/* selector + detalle */
.sel{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%}
.sel:hover{border-color:var(--brass)}.sel:focus-visible{outline:2px solid var(--brass)}
.sel[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--sun) 16%,var(--surface))}
.sel .ic{color:var(--brass)}
.sel i.dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.18)}
.sel b{font-size:.92rem;font-weight:700;display:block}
.sel small{display:block;color:var(--muted);font-size:.78rem}
.sel-list{display:grid;gap:8px}
.detail{padding:22px;border-radius:18px;background:var(--linen);color:#22302a;display:grid;gap:8px;align-content:start}
.detail .eyebrow{color:#8a6430}
.detail h3{font-size:1.5rem}
.detail p{color:#3c4a42}
.detail .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.detail .btn-primary{background:#2b5443;color:#ece7d3}
.detail .btn-ghost{color:#22302a;border-color:rgba(43,84,67,.4)}
/* línea de tiempo */
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.tl::before{content:"";position:absolute;left:12%;right:12%;top:25px;height:1px;background:var(--line)}
.tl button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:8px;text-align:center;position:relative;padding:4px}
.tl button:focus-visible{outline:2px solid var(--brass);border-radius:12px}
.tl .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font:400 1.2rem/1 var(--f-display);color:var(--muted);transition:.2s}
.tl button[aria-pressed="true"] .n{background:var(--forest);color:#f2c66d;border-color:var(--forest);transform:scale(1.12)}
.tl span.t{font:600 .62rem/1.35 var(--f-caps);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tl button[aria-pressed="true"] span.t{color:var(--fg)}
@media (max-width:620px){.tl{grid-template-columns:1fr 1fr 1fr 1fr}.tl span.t{font-size:.52rem}}
/* péndulo y figuras */
.pend{width:100%;max-width:230px;display:block;margin:0 auto;color:var(--fg)}
.pend .hs{cursor:pointer}
.pend .hs rect.hit{fill:transparent;stroke:transparent;stroke-width:3;transition:.2s}
.pend .hs:hover rect.hit{stroke:var(--brass);stroke-dasharray:4 3}
.pend .hs.on rect.hit{stroke:var(--brass);fill:rgba(242,198,109,.22)}
.pend .hs:focus-visible{outline:none}
.pend .hs:focus-visible rect.hit{stroke:var(--brass)}
.swing{transform-origin:120px 0;animation:swing 3.2s ease-in-out infinite alternate}
.swing.off{animation:none}
@keyframes swing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.fig{width:100%;max-width:250px;display:block;margin:0 auto}
.fig [data-rx]{cursor:pointer}
.fig .cdot{transition:r .2s}
.fig g:focus-visible{outline:none}
.fig g:focus-visible .cdot{stroke:var(--brass);stroke-width:3}
.aura .layer{transition:filter .6s,opacity .6s}
.aura.blocked .layers{filter:grayscale(.95) brightness(.72) contrast(.9)}
.aura .glow{animation:glow 4s ease-in-out infinite alternate}
.aura.blocked .glow{animation:none;opacity:.2}
@keyframes glow{from{opacity:.75}to{opacity:1}}
.aura .blob{opacity:0;transition:opacity .6s}
.aura.blocked .blob{opacity:.8}
.breath{width:130px;height:130px;border-radius:50%;margin:6px auto;background:radial-gradient(circle at 40% 35%,#f8dc9a,#c9963f 70%);box-shadow:0 0 50px rgba(242,198,109,.45);animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.68)}50%{transform:scale(1)}}
/* materiales */
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kit button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);position:relative;min-height:84px;align-content:start}
.kit button:hover{border-color:var(--brass)}.kit button:focus-visible{outline:2px solid var(--brass)}
.kit button[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--sun) 16%,var(--surface))}
.kit .k{font:400 1.3rem/1 var(--f-display);color:var(--brass)}
.kit b{font-size:.86rem;font-weight:700;line-height:1.3}
.kit .have{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--ok);display:none}
.kit .have::after{content:"";position:absolute;left:5px;top:5px;width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg)}
.kit button.got .have{display:block}
.prog{display:flex;align-items:center;gap:12px;font-size:.84rem;color:var(--muted)}
.prog .bar{flex:1;max-width:260px}
/* checklist / resuena */
.ck{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%;line-height:1.4}
.ck:hover{border-color:var(--brass)}.ck:focus-visible{outline:2px solid var(--brass)}
.ck .box{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;display:grid;place-items:center;transition:.2s}
.ck[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.ck[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ck b{font-weight:700}
/* ficha */
.fgrid{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));gap:4px;max-width:520px}
.fgrid .hd{font:600 .6rem/1 var(--f-caps);letter-spacing:.06em;color:var(--muted);display:grid;place-items:center;height:26px}
.fgrid button{all:unset;box-sizing:border-box;cursor:pointer;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);transition:.15s}
.fgrid button:hover{border-color:var(--brass)}.fgrid button:focus-visible{outline:2px solid var(--brass)}
.fgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
/* quiz */
.qopt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%;line-height:1.4}
.qopt:hover{border-color:var(--brass)}.qopt:focus-visible{outline:2px solid var(--brass)}
.qopt[disabled]{cursor:default}
.qopt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.qopt.wrong{border-color:var(--live);background:color-mix(in srgb,var(--live) 10%,var(--surface))}
.qopt .l{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72rem/1 var(--f-body);flex-shrink:0}
.qscore{font:400 clamp(3rem,8vw,5rem)/1 var(--f-display);color:var(--brass)}
/* trabajo a distancia */
.stp{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.stp:first-child{border-top:0}
.stp .n{width:34px;height:34px;border-radius:50%;background:var(--forest);color:#f2c66d;display:grid;place-items:center;font:400 1.05rem/1 var(--f-display)}
.stp b{font:600 .7rem/1.4 var(--f-caps);letter-spacing:.14em;text-transform:uppercase}
.stp p{font-size:.9rem;color:var(--muted);margin-top:2px}
.testigo{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.testigo header{background:#6b4a2b;color:#f6ecd8;padding:14px 18px;font:600 .7rem/1 var(--f-caps);letter-spacing:.16em;text-transform:uppercase}
.testigo .tb{padding:18px;display:grid;gap:14px}
.testigo label{display:grid;gap:6px;font-size:.8rem;font-weight:700}
.testigo textarea{min-height:90px}
.testigo .cb{display:flex;gap:10px;align-items:center;font-weight:400;font-size:.9rem}
.testigo .cb input{width:18px;height:18px;accent-color:#2b5443}
/* camino de 5 niveles */
.mini-path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mini-path div{padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;display:grid;gap:4px}
.mini-path b{font:400 1.5rem/1 var(--f-display);color:var(--brass)}
.mini-path span{font-size:.72rem;line-height:1.3;color:var(--muted)}
.mini-path .now{background:var(--forest);border-color:var(--forest)}
.mini-path .now b{color:#f2c66d}.mini-path .now span{color:#ece7d3}
@media (max-width:620px){.mini-path{grid-template-columns:1fr 1fr}}
.dk-cta{display:flex;flex-wrap:wrap;gap:10px}
/* ampliar */
.dk-zoom{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:600 .6rem/1 var(--f-caps);letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:var(--surface)}
.dk-zoom:hover{border-color:var(--brass)}.dk-zoom:focus-visible{outline:2px solid var(--brass)}
.dk-zoom svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dk-tr{display:flex;align-items:center;gap:12px}
.flip{height:240px}
.flip .b{overflow:auto;font-size:.9rem;line-height:1.45}
.flip .f b{overflow-wrap:anywhere}
.tg,.sel b,.ck span,.kit b,.qopt span,.stp p{overflow-wrap:anywhere}
.deck.full{position:fixed;inset:0;z-index:60;border-radius:0;border:0;display:flex;flex-direction:column;background:var(--surface)}
.deck.full .dk-body{flex:1;overflow:auto;min-height:0;width:100%;max-width:1100px;margin:0 auto;font-size:1.1rem;align-content:start}
.deck.full .dk-h h2{font-size:clamp(2rem,4.2vw,3.1rem)}
.deck.full .flip{height:300px}
.deck.full .flip .b{font-size:1.05rem}
.deck.full .pend,.deck.full .fig{max-width:340px}
.deck.full .dk-quote{font-size:clamp(1.5rem,3vw,2.2rem)}

.sl-dots{display:flex;gap:6px;justify-content:center;align-items:center}
.sl-dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line);transition:.2s}
.sl-dots button[aria-current="true"]{background:var(--brass);width:22px;border-radius:999px}

/* ===== Nivel 2 · limpieza de casas y espacios ===== */
.n2-w{width:100%;max-width:560px;margin-inline:auto}.n2-w.sq{max-width:460px}.n2-w.wide{max-width:860px}
.n2-svg{display:block;width:100%;height:auto}
.n2-svg text{font-family:var(--f-body);pointer-events:none;user-select:none}
.n2-svg g[data-rx]{cursor:pointer;outline:none}
.n2-svg g[data-rx]:hover path,.n2-svg g[data-rx]:hover rect{filter:brightness(1.07)}
.n2-svg g[data-rx]:focus-visible path,.n2-svg g[data-rx]:focus-visible rect{stroke:var(--brass);stroke-width:4.5}
.n2-ends{display:flex;justify-content:space-between;gap:10px;max-width:560px;width:100%;margin:-4px auto 0}
.n2-ends span{font:600 .6rem/1.25 var(--f-caps);letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:8px 12px;border-radius:10px}
.n2-ends .lo{background:#b53a22}.n2-ends .hi{background:#2f7a38}
input[type=range].n2-range{width:100%;accent-color:var(--forest);padding:0;background:none;border:0}
.n2-lv{display:inline-flex;gap:8px;align-items:center}
.n2-sw{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.18)}
.dk-body .tbl td,.dk-body .tbl th{padding:10px}
.qopt span{min-width:0}
.n2-k{width:26px;height:26px;border-radius:50%;background:var(--forest);color:#f2c66d;display:grid;place-items:center;font:400 .95rem/1 var(--f-display);flex-shrink:0}
.n2-house{position:relative;display:grid;place-items:center;aspect-ratio:1;width:min(100%,250px);margin:auto;border-radius:50%;background:var(--surface-2);color:var(--muted);transition:background .5s,color .5s,box-shadow .5s}
.n2-house svg{width:44%;height:auto;stroke:currentColor}
.n2-halo{position:absolute;inset:7%;border-radius:50%;border:2px dashed var(--line);transition:.5s}
.n2-house.on{background:color-mix(in srgb,var(--sun) 26%,var(--surface));color:var(--forest);box-shadow:0 0 0 10px color-mix(in srgb,var(--sun) 16%,transparent),0 0 60px color-mix(in srgb,var(--sun) 40%,transparent)}
.n2-house.on .n2-halo{border-color:var(--brass);border-style:solid}
.sel.n2-sm{padding:8px 10px;gap:8px;font-size:.84rem}
.n2-n{font:700 .7rem/1 var(--f-caps);color:var(--muted);min-width:1.3em}
.n2-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.n2-f{display:grid;gap:8px;align-content:start}
.n2-f>span{font:600 .62rem/1.2 var(--f-caps);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.n2-bov{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.n2-bov input{max-width:200px}
.n2-zones{display:grid;gap:10px}
.n2-zr{display:grid;grid-template-columns:minmax(110px,.9fr) 110px minmax(0,2fr) auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
@media (max-width:720px){.n2-zr{grid-template-columns:1fr 1fr}.n2-zr b{grid-column:1/-1}.n2-zr input[type=text]{grid-column:1/-1}}
.n2-sheet{--fg:#22302a;--muted:#5d6b63;--line:#d9d5c3;--surface:#fffdf6;--surface-2:#f0ede1;background:#fffdf6;color:#22302a;border:1px solid #d9d5c3;border-radius:16px;padding:clamp(16px,3vw,28px);display:grid;gap:14px}
.n2-sheet header{display:flex;gap:12px;align-items:center;border-bottom:1px solid #d9d5c3;padding-bottom:12px}
.n2-sheet header .mo{width:44px;height:44px;color:#2b5443;flex-shrink:0}
.n2-sheet header b{font:400 1.3rem/1.2 var(--f-display)}.n2-sheet header small{display:block;color:#5d6b63;font-size:.74rem}
.n2-dl{display:grid;grid-template-columns:minmax(120px,.35fr) 1fr;gap:0 16px;margin:0}
.n2-dl dt{font:600 .62rem/1.5 var(--f-caps);letter-spacing:.12em;text-transform:uppercase;color:#8a6430;padding-top:12px;border-top:1px solid #e6e1cf}
.n2-dl dd{margin:0;padding:10px 0 4px;border-top:1px solid #e6e1cf;display:grid;gap:6px;align-content:start;overflow-wrap:anywhere}
@media (max-width:620px){.n2-dl{grid-template-columns:1fr}.n2-dl dd{border-top:0;padding-top:0}}
.n2-f input[type=number],.n2-f input[type=date],.n2-zr input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.n2-zr input{min-width:0;padding:10px 12px}
.n2-empty{color:#9a9a8f;font-style:normal}

/* ===== Nivel 3 ===== */
.dk-video{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;background:#000}
.dk-img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:#fff}
.dk-fig{margin:0}
.n3-mantra{font:400 clamp(2.6rem,7vw,4.2rem)/1 var(--f-display);letter-spacing:.04em}
.n3-turn{width:46px;height:46px;color:#2b5443;flex-shrink:0}
.n3-turn.ccw{transform:scaleX(-1)}
.n3-spin{transform-origin:12px 12px;animation:n3spin 7s linear infinite}
@keyframes n3spin{to{transform:rotate(360deg)}}
.n3-lab{display:grid;gap:6px;font-weight:600;font-size:.9rem}
.n3-lab textarea,.n3-lab input{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface,#fff);color:inherit;min-height:44px}
.n3-lab textarea{min-height:96px;resize:vertical}
.n3-photo{width:220px;height:220px;max-width:100%;object-fit:cover;object-position:50% 25%;border-radius:50%;border:3px solid var(--brass);justify-self:center}
.dk-foot .sl-dots{flex:1;min-width:0;gap:4px}
.dk-foot .sl-dots button{flex:0 1 9px;min-width:4px;height:9px}
.dk-foot .sl-dots button[aria-current="true"]{flex:0 0 18px}
.n3-q{font-family:var(--f-display);font-style:italic}
.n3-yn{display:flex;gap:6px}
.n3-nf{font-weight:700;color:var(--brass)}

/* modal + toast */

function n2fiSync(){const p=n2fiPct();
 document.querySelectorAll('.n2fi-pct').forEach(e=>{e.textContent=p});document.querySelectorAll('.n2fi-fill').forEach(e=>{e.style.width=p+'%'});
 document.querySelectorAll('[data-n2lv]').forEach(e=>{e.textContent=n2fiLv(e.dataset.n2lv)});document.querySelectorAll('[data-n2var]').forEach(e=>{e.textContent=n2fiVar()})}
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;
 if(t.dataset.n2b!==undefined){RS.n2bv=+t.value;n2bUpd()}
 else if(t.dataset.n2z!==undefined){st('n2z',N2ZI.slice())[+t.dataset.n2z]=+t.value;n2zUpd()}
 else if(t.dataset.n2pc!==undefined){RS.n2pc=+t.value;n2pcUpd()}
 else if(t.dataset.n3c3bv!==undefined){RS.n3c3bv=+t.value;n3c3bvUpd()}
 else if(t.dataset.n2i!==undefined){FI()[t.dataset.n2i]=t.value;n2fiSync()}});

/* acciones de las clases interactivas */
function rxAct(p,el){const [a,k,v]=p;
 if(a==='set'){RS[k]=/^-?\d+$/.test(v)?+v:v;render(false)}
 else if(a==='tog'){const o=st(k,{});o[v]=!o[v];render(false)}
 else if(a==='flip'){const o=st(k,{});o[v]=!o[v];el.classList.toggle('on',!!o[v]);el.setAttribute('aria-pressed',!!o[v])}
 else if(a==='cell'){const o=st('cells'+k,{});o[v]=!o[v];render(false)}
 else if(a==='bd'){if(k==='add'){RS.bdN=Math.min(7,st('bdN',1)+1);RS.bdS=RS.bdN-1}else{RS.bdN=1;RS.bdS=0}render(false)}
 else if(a==='pr'){RS.pr=Math.max(0,Math.min(PRAYER.length-1,st('pr',0)+ +k));render(false)}
 else if(a==='qa'){const z=st('qz',{i:0,a:{}});if(z.a[z.i]===undefined){z.a[z.i]=+k;render(false)}}
 else if(a==='qn'){const z=st('qz',{i:0,a:{}});if(z.i>=QUIZ.length-1)z.fin=1;else z.i++;render(false)}
 else if(a==='qr'){RS.qz={i:0,a:{}};render(false)}
 else if(a==='n2o'){const o=st('n2o',{n:0,ord:[],msg:''});if(+k===o.n){o.n++;o.msg=''}else o.msg='Ese no es el siguiente paso. Piensa qué ocurre primero.';render(false)}
 else if(a==='n2or'){delete RS.n2o;render(false)}
 else if(a==='n2pr'){RS.n2pr=Math.max(0,Math.min(N2PRAYER.length-1,st('n2pr',0)+ +k));render(false)}
 else if(a==='n2fa'){const f=st('n2f',{i:0,a:null});if(f.a===null){f.a=+k;render(false)}}
 else if(a==='n2fn'){const f=st('n2f',{i:0,a:null});f.i=f.i>=3?0:f.i+1;f.a=null;render(false)}
 else if(a==='n2qa'){const z=st('n2qz',{i:0,a:{}});if(z.a[z.i]===undefined){z.a[z.i]=+k;render(false)}}
 else if(a==='n2qn'){const z=st('n2qz',{i:0,a:{}});if(z.i>=N2QUIZ.length-1)z.fin=1;else z.i++;render(false)}
 else if(a==='n2qr'){RS.n2qz={i:0,a:{}};render(false)}
 else if(a==='n2fs'){const o=FI();o[k]=o[k]===+v?undefined:+v;render(false)}
 else if(a==='n2ft'){const o=FI();const r=o[k]||(o[k]=[]);const i=r.indexOf(+v);if(i<0)r.push(+v);else r.splice(i,1);render(false)}
 else if(a==='n2fclr'){RS.n2fid={};RS.n2sent=0;render(false)}
 else if(a==='n2demo'){RS.n2fid=JSON.parse(JSON.stringify(N2FDEMO));render(false)}
 else if(a==='n2send'){RS.n2sent=1;render(false)}
 else if(a==='n2unsend'){RS.n2sent=0;render(false)}
 else if(a==='n2bv'){RS.n2bv=+k;render(false)}
 else if(a==='n2pcs'){RS.n2pc=+k;render(false)}
 else if(a==='n3pr'){RS[k]=n3clamp(st(k,0)+ +v,0,(N3LEN[k]||1)-1);render(false)}
 else if(a==='n3qa'){const z=st('n3q'+k,{i:0,a:{}});if(z.a[z.i]===undefined){z.a[z.i]=+v;render(false)}}
 else if(a==='n3qn'){const z=st('n3q'+k,{i:0,a:{}});if(z.i>=N3QZ[k].length-1)z.fin=1;else z.i++;render(false)}
 else if(a==='n3qr'){RS['n3q'+k]={i:0,a:{}};render(false)}
 else if(a==='n3rnd'){RS[k]=Math.floor(Math.random()*+v);render(false)}
 else if(a==='n3o'){const o=RS.n3ord;if(!o)return;if(+v===o.n){o.n++;o.msg=''}else o.msg='Ese no es el siguiente cuerpo. Piensa qué viene primero.';render(false)}
 else if(a==='n3or'){delete RS.n3ord;render(false)}
 else if(a==='n3c3eg'){const z=st('n3c3eg',{});if(z[k]===+v)delete z[k];else z[k]=+v;render(false)}
 else if(a==='n3c3egr'){delete RS.n3c3eg;render(false)}
 else if(a==='n3cal'){const c=st('n3cal',{});if(c[k]===+v)delete c[k];else c[k]=+v;render(false)}

 else if(a==='n3calp'){const P=PND.cal,m=P?N3CALM.indexOf(P.want):-1;if(m<0)RS.n3calmsg='Primero elige arriba el movimiento que hizo tu péndulo.';else{st('n3cal',{})[k]=m;RS.n3calmsg='';delete RS.n3sim}render(false)}
 else if(a==='n3simask'){const c=st('n3cal',{}),ks=Object.keys(c).map(Number),s=st('n3sim',{});let t;do{t=ks[Math.floor(Math.random()*ks.length)]}while(ks.length>1&&t===s.t);
  RS.n3sim={t,n:s.n||0,ok:s.ok||0};const P=PND.sim;if(P){P.want=N3CALM[c[t]];if(P.cur==='free')P.cur='rest'}render(false)}
 else if(a==='n3simpick'){const s=st('n3sim',{}),c=st('n3cal',{});if(s.pick===undefined&&s.t!==undefined){s.pick=+k;s.n=(s.n||0)+1;if(c[+k]===c[s.t])s.ok=(s.ok||0)+1;render(false)}}
 else if(window.RX&&RX[a])RX[a](k,v,el); // acciones propias de un nivel (p. ej. curso/n4.js)
 else if(a==='n3yn'){const [i,x]=v.split('_');const o=st(k,{});o[i]=o[i]===+x?undefined:+x;render(false)}
}
document.addEventListener('click',e=>{const r=e.target.closest('[data-rx]');if(r)rxAct(r.dataset.rx.split('|'),r)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-rx],ellipse[data-rx]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.rsin;if(k){RS[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(k==='n3nom'||k==='n3fn')document.querySelectorAll('.n3-nf').forEach(s=>s.innerHTML=n3nf())}});

/* ---------- vista gratis, clases en vivo y videos ---------- */
// Sin inscripción se ven los títulos del Nivel 1; de los demás niveles, solo nombre y duración
// cada alumna tiene sus propios niveles abiertos (p. ej. solo el Nivel 3)
const hasLv=n=>CM.isAdmin||S.lvls.has(n);
const detailOpen=lv=>CM.isAdmin||S.paying||lv.n===1||hasLv(lv.n);
const CTA_TXT='Comienza tu formación: 9 cuotas de 55 USD';
const LIVE_OPEN_MIN=15;
const liveOf=key=>CM.agenda.find(a=>a.id===key);
const liveEnd=a=>a.start.toMillis()+(a.durationMin||90)*60000;
const liveState=a=>{const n=Date.now();return n<a.start.toMillis()-LIVE_OPEN_MIN*60000?'soon':n<=liveEnd(a)?'open':'done'};
const fmtWhen=a=>a.start.toDate().toLocaleString('es',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const fmtHour=ms=>new Date(ms).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
const isHttps=u=>/^https:\/\/[^\s"<>]+$/i.test(u||'');
const keyLesson=key=>{const [id,i,j]=String(key).split('_');const lv=LEVELS.find(l=>l.id===id);const les=lv&&lv.modules[+i]&&lv.modules[+i].lessons[+j];return les?{lv,i:+i,j:+j,les}:null};
// YouTube, Vimeo y Google Drive se ven dentro del aula; cualquier otro enlace se abre aparte
function embedURL(u){try{const x=new URL(u);const h=x.hostname.replace(/^www\./,'');
  if(h==='youtu.be')return 'https://www.youtube-nocookie.com/embed/'+x.pathname.slice(1);
  if(h.endsWith('youtube.com')){const v=x.searchParams.get('v')||(x.pathname.match(/\/(?:live|embed|shorts)\/([\w-]+)/)||[])[1];if(v)return 'https://www.youtube-nocookie.com/embed/'+v}
  if(h.endsWith('vimeo.com')){const v=(x.pathname.match(/(\d{5,})/)||[])[1];if(v)return 'https://player.vimeo.com/video/'+v}
  if(h==='drive.google.com'){const v=(x.pathname.match(/\/d\/([\w-]+)/)||[])[1];if(v)return 'https://drive.google.com/file/d/'+v+'/preview'}
}catch(e){}return ''}
const playerMsg=inner=>`<div class="player"><svg class="motif"><use href="#mark"/></svg><div style="position:relative;display:grid;gap:12px;justify-items:center;text-align:center;padding:20px">${inner}</div></div>`;
const lightBtn='class="btn btn-primary btn-sm" style="background:#e9e4d0;color:#1f3f32"';
function videoHTML(u,label){const e=embedURL(u);
  if(e)return `<div class="player"><iframe src="${esc(e)}" title="${esc(label)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div>`;
  return playerMsg(`<b style="font:400 clamp(1.2rem,3vw,1.8rem)/1.2 var(--f-display)">${esc(label)}</b>${isHttps(u)?`<a ${lightBtn} href="${esc(u)}" target="_blank" rel="noopener">Ver el video</a>`:''}`)}
// la clase en vivo de una lección: antes, la fecha y el botón para entrar; después, la grabación
function liveHTML(key,les){const a=liveOf(key);if(!a)return '';const L=CM.liveLinks[key]||{};const st=liveState(a);
  if(st==='done'&&L.recordingUrl)return videoHTML(L.recordingUrl,'Grabación · '+les.t);
  const pill=t=>`<span class="pill live" style="color:#ece7d3;border-color:rgba(236,231,211,.4)">${t}</span>`;
  const title=`<b style="font:400 clamp(1.2rem,3vw,1.8rem)/1.2 var(--f-display)">${esc(les.t)}</b>`;
  const note=t=>`<span style="color:#b9c4b5;font-size:.88rem;max-width:30em">${t}</span>`;
  if(st==='done')return playerMsg(pill('Clase realizada')+title+note('La grabación de esta clase quedará aquí muy pronto.'));
  return playerMsg(pill(st==='open'?'En vivo ahora':'Próxima clase en vivo')+title+note(fmtWhen(a)+' · '+(a.durationMin||90)+' min')
    +(st==='open'&&isHttps(L.url)?`<a ${lightBtn} href="${esc(L.url)}" target="_blank" rel="noopener">Entrar a la clase</a>`:note('La sala se abre '+LIVE_OPEN_MIN+' minutos antes de la clase. La grabación queda aquí al terminar.')))}
const gcalLink=a=>{const f=ms=>new Date(ms).toISOString().replace(/[-:]|\.\d{3}/g,'');return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(a.title+' · Casa Muladhara')+'&dates='+f(a.start.toMillis())+'/'+f(liveEnd(a))};
function liveDate(a){const d=a.start.toDate();return `<div class="date"><small>${d.toLocaleDateString('es',{weekday:'short'}).replace('.','')}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('es',{month:'short'}).replace('.','')}</small></div>`}
function liveActs(a){const k=keyLesson(a.id),L=CM.liveLinks[a.id]||{},open=liveState(a)==='open';
  if(!hasLv(a.level))return `<button class="btn btn-ghost btn-sm" data-go="pagos">Inscríbete</button>`;
  return (open&&isHttps(L.url)?`<a class="btn btn-primary btn-sm" href="${esc(L.url)}" target="_blank" rel="noopener">Entrar</a>`:'')
    +(k?`<button class="btn btn-ghost btn-sm" data-open-lesson="${k.lv.id},${k.i},${k.j}">Ver clase</button>`:'');}
const upcomingLive=()=>CM.agenda.filter(a=>liveEnd(a)>=Date.now());
const toLocalInput=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);

function fileHTML(f){const k=f.k||f.type;return `<div class="file"><span class="ficon ${k}">${k.toUpperCase()}</span><div class="fx"><b>${esc(f.t||f.name)}</b><small>${f.size}</small></div>${f.href&&f.lvl>0&&!hasLv(f.lvl)?`<button class="btn btn-ghost btn-sm" data-go="pagos">Inscríbete</button>`:f.href?`<a class="btn btn-ghost btn-sm" href="${f.href}" target="_blank" rel="noopener">Abrir PDF</a>`:`<button class="btn btn-ghost btn-sm" data-toast="En la plataforma real esto descarga el archivo">${k==='mp3'||k==='mp4'?'Reproducir':'Descargar'}</button>`}</div>`}

V.formacion=()=>`
  <div class="view-head"><div><span class="eyebrow">Escuela de Formación Holística</span><h1>Mi formación</h1><p>Cinco niveles que te llevan a la certificación de Terapeuta Holístico Integral. Toca un nivel para ver sus clases, videos y materiales.</p></div>

V.curso=()=>{
  const lv=LEVELS.find(l=>l.id===S.level);const [mi,li]=S.lesson;const les=lv.modules[mi].lessons[li];
  const locked=lv.status==='locked';
  const flat=allLessons(lv);const doneN=flat.filter(l=>l.done).length;
  const upcoming=!locked&&!les.done&&/En vivo/.test(les.len);
  const isSl=!!les.slides;
  if(!detailOpen(lv))return `<div class="crumbs"><button data-go="formacion">Mi formación</button><span>/</span><span>Nivel ${lv.n} · ${lv.title}</span></div>
  <div style="max-width:900px">${playerMsg(`<span class="pill pres">Nivel ${lv.n}</span><b style="font:400 clamp(1.2rem,3vw,1.8rem)/1.2 var(--f-display)">${lv.title}</b><span style="color:#b9c4b5;font-size:.9rem">${lv.dur}</span><span style="color:#b9c4b5;font-size:.9rem;max-width:30em">El programa de este nivel se muestra al inscribirte en la formación.</span><button ${lightBtn} data-go="pagos">${CTA_TXT}</button>`)}</div>`;
  const live=!locked&&liveHTML(lv.id+'_'+mi+'_'+li,les);
  if(S.overdue&&locked&&!CM.isAdmin)return `<div class="crumbs"><button data-go="formacion">Mi formación</button><span>/</span><span>Nivel ${lv.n} · ${lv.title}</span></div>
  <div class="player" style="max-width:900px"><svg class="motif"><use href="#mark"/></svg><div style="position:relative;display:grid;gap:12px;justify-items:center;text-align:center;padding:20px"><span class="pill bad" style="background:rgba(239,138,115,.2);color:#ffd2c7">Acceso pausado</span><b style="font:400 clamp(1.2rem,3vw,1.8rem)/1.2 var(--f-display)">${esc(les.t)}</b><span style="color:#b9c4b5;font-size:.9rem;max-width:30em">Esta clase vuelve a estar disponible en cuanto se registre el pago de tu cuota. No pierdes tu avance.</span><button class="btn btn-sm" style="background:#e9e4d0;color:#1f3f32" data-checkout="portal">Actualizar mi pago</button></div></div>`;
  const tabs=[['temas','Temas de la clase'],['materiales','Materiales'],['preguntas','Preguntas'],['notas','Mis notas']];
  const key=lv.id+'_'+mi+'_'+li;
  const qa=(CM.questions[key]||[]).flatMap(q=>[{who:ME.name,ini:ME.ini,c:ME.c,photo:ME.photo,txt:q.text}].concat(q.reply?[{who:'Maestra Holística',karen:1,ini:'MH',txt:q.reply,reply:1}]:[]));
  const dur=toSec(les.len)||1;
  const si=isSl?Math.min(S.sl[key]||0,les.slides.length-1):0;
  const body={
    temas:isSl?`<ol class="chapters">${les.topics.map((c,i)=>`<li class="${si===i?'now':''}"><button data-slide="${i}"><span class="ts">${c.ts}</span><span><span class="ct">${esc(c.t)}</span>${c.d?`<span class="cd">${esc(c.d)}</span>`:''}</span></button></li>`).join('')}</ol>`:les.topics.length?`<ol class="chapters">${les.topics.map((c,i)=>`<li class="${curChapter(les)===i?'now':''}"><button data-seek="${toSec(c.ts)}"><span class="ts">${c.ts}</span><span><span class="ct">${esc(c.t)}</span>${c.d?`<span class="cd">${esc(c.d)}</span>`:''}</span></button></li>`).join('')}</ol>`:`<p class="muted">Los temas de esta clase se publican cuando se abre el nivel.</p>`,
    materiales:les.files.length?`<div class="files">${les.files.map(f=>fileHTML({...f,k:f.type})).join('')}</div>`:`<p class="muted">Esta clase no tiene materiales descargables.</p>`,
    preguntas:`<div class="qa">${qa.map(q=>`<div class="q ${q.reply?'reply':''}">${av(q)}<div class="bubble"><b>${esc(q.who)}</b>${q.karen?'<span class="tag-k">Maestra</span>':''}<p>${esc(q.txt)}</p></div></div>`).join('')||'<p class="muted">Aún no hay preguntas. Sé la primera.</p>'}
      <form class="reply-form" id="qa-form"><input type="text" id="qa-in" placeholder="Escribe tu pregunta para la Maestra Holística" aria-label="Tu pregunta"><button class="btn btn-primary btn-sm">Enviar</button></form></div>`,
    notas:`<textarea id="notes" placeholder="Tus apuntes de esta clase. Solo tú los ves.">${esc(CM.notes[key]||'')}</textarea><div><button class="btn btn-ghost btn-sm" id="save-notes">Guardar notas</button></div>`
  };
  return `
  <div class="crumbs"><button data-go="formacion">Mi formación</button><span>/</span><span>Nivel ${lv.n} · ${lv.title}</span></div>
  <div class="course">
    <div style="display:grid;gap:20px;min-width:0">
      ${locked?`<div class="player"><svg class="motif"><use href="#mark"/></svg><div style="position:relative;display:grid;gap:12px;justify-items:center;text-align:center;padding:20px"><span class="pill pres">Nivel ${lv.n}</span><b style="font:400 clamp(1.2rem,3vw,1.8rem)/1.2 var(--f-display)">${lv.title}</b>${S.paying?`<span style="color:#b9c4b5;font-size:.9rem">Se desbloquea al completar el Nivel ${lv.n-1}</span><button class="btn btn-primary btn-sm" style="background:#e9e4d0;color:#1f3f32" data-go="pagos">Ver mi plan</button>`:`<span style="color:#b9c4b5;font-size:.9rem;max-width:30em">Esta clase es parte de la formación completa. Inscríbete para abrir las clases, videos y materiales nivel a nivel.</span><button class="btn btn-primary btn-sm" style="background:#e9e4d0;color:#1f3f32" data-go="pagos">Ver cómo inscribirme</button>`}</div></div>`:
      live&&!isSl?live:upcoming?`<div class="player"><svg class="motif"><use href="#mark"/></svg><div class="cap"><div><small>Nivel ${lv.n} · Próxima clase en vivo</small><b>${esc(les.t)}</b></div></div><div style="position:relative;display:grid;gap:12px;justify-items:center;text-align:center"><span class="pill live" style="color:#ece7d3;border-color:rgba(236,231,211,.4)">${les.len.replace('En vivo','En vivo el')}</span><span style="color:#b9c4b5;font-size:.88rem">La Maestra publicará aquí la fecha y el enlace de la sala.</span><span style="color:#b9c4b5;font-size:.82rem">La grabación queda aquí al terminar</span></div></div>`:
      isSl?(live||'')+deckHTML(les,si):`<div class="player" id="player"><svg class="motif"><use href="#mark"/></svg>
        <div class="cap"><div><small>Nivel ${lv.n} · ${esc(lv.modules[mi].title)}</small><b>${esc(les.t)}</b></div></div>
        <button class="play" id="play" aria-label="${S.playing?'Pausar':'Reproducir'}">${S.playing?'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}</button>
        ${les.topics.length?`<span class="chapter-now" id="chap-now">${esc(les.topics[curChapter(les)].t)}</span>`:''}
        <div class="controls"><button id="play2" aria-label="Reproducir o pausar">${S.playing?'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}</button>
        <span id="tnow">${fmt(S.t)}</span><div class="track" id="track"><i id="tfill" style="width:${S.t/dur*100}%"></i>${les.topics.slice(1).map(c=>`<span style="left:${toSec(c.ts)/dur*100}%"></span>`).join('')}</div><span>${les.len}</span></div></div>`}
      <div class="lesson-head"><div><div style="display:flex;gap:8px;flex-wrap:wrap">${modePill(lv)}${les.done?'<span class="pill done">Vista</span>':''}</div><h2>${esc(les.t)}</h2></div>
        ${!locked&&!upcoming?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ${les.done?'btn-ghost':'btn-primary'} btn-sm" id="mark-done">${les.done?'Marcar como no vista':'Marcar como vista'}</button><button class="btn btn-ghost btn-sm" id="next-les">Siguiente clase</button></div>`:''}</div>
      ${locked?`<div class="lock-note">${icLock}<span>${S.paying?`Puedes revisar el programa completo. Las clases, videos y materiales se abren cuando completes el Nivel ${lv.n-1}.`:`Puedes revisar el programa completo. Las clases, videos y materiales se abren al inscribirte en la formación: 9 cuotas de 55 USD o un solo pago.`}</span></div>`:
      `<div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${n}${k==='preguntas'&&qa.length?` (${qa.length})`:''}</button>`).join('')}</div><div>${body[S.tab]}</div>`}
    </div>
    <aside class="card syllabus">
      <div class="syl-top"><span class="eyebrow">Nivel ${lv.n}</span><h3>${lv.title}</h3>${statusPill(lv)}<div class="bar"><i style="width:${pct(lv)}%"></i></div><div class="row"><span>${doneN} de ${flat.length} clases</span><span>${pct(lv)}%</span></div></div>
      ${lv.modules.map((m,i)=>{const open=S.openMods[lv.id+i]!==undefined?S.openMods[lv.id+i]:i===mi;const md=m.lessons.filter(l=>l.done).length;
        return `<div class="mod"><button class="mod-h" aria-expanded="${open}" data-mod="${i}"><b>${esc(m.title)}</b><small>${md}/${m.lessons.length}</small><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <div ${open?'':'hidden'}>${m.lessons.map((l,j)=>`<button class="les ${i===mi&&j===li?'cur':''} ${locked?'locked':''}" data-les="${i},${j}" ${locked?'aria-disabled="true"':''}><span class="chk ${l.done?'on':''} ${locked?'lk':''}">${locked?icLock:''}</span><span>${esc(l.t)}</span><small>${esc(l.len)}</small></button>`).join('')}</div></div>`}).join('')}
      ${!S.paying&&!CM.isAdmin?`<div style="padding:18px;display:grid;gap:10px;border-top:1px solid var(--line)"><p class="muted" style="margin:0;font-size:.88rem">Las clases, videos y materiales se abren al inscribirte en la formación completa.</p><button class="btn btn-primary btn-sm" data-go="pagos">${CTA_TXT}</button></div>`:''}
    </aside>
  </div>${CM.isAdmin&&!locked?liveEditor(lv,mi,li):''}`;
};
// Solo la Maestra: programa la clase en vivo de esta lección y agrega la grabación
function liveEditor(lv,mi,li){const key=lv.id+'_'+mi+'_'+li,a=liveOf(key),L=CM.liveLinks[key]||{};
  return `<details class="card panel" style="margin-top:20px" ${a?'open':''}><summary style="cursor:pointer"><b>Clase en vivo de esta lección</b> <span class="muted" style="font-size:.84rem">· solo la Maestra</span></summary>
  <form id="live-form" data-key="${key}" data-level="${lv.n}" style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:12px">
    <label class="n2-f"><span>Fecha y hora</span><input type="datetime-local" id="lv-start" value="${a?toLocalInput(a.start.toDate()):''}" required></label>
    <label class="n2-f"><span>Duración (minutos)</span><input type="number" id="lv-dur" min="15" max="600" step="5" value="${a?a.durationMin:90}"></label>
    <label class="n2-f"><span>Enlace de la sala (Zoom o Meet)</span><input type="url" id="lv-url" placeholder="https://" value="${esc(L.url||'')}"></label>
    <label class="n2-f"><span>Grabación (YouTube, Vimeo o Drive)</span><input type="url" id="lv-rec" placeholder="https://" value="${esc(L.recordingUrl||'')}"></label>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary btn-sm">Guardar</button>${a?'<button type="button" class="btn btn-ghost btn-sm" id="lv-del">Quitar esta clase en vivo</button>':''}</div>
  </form><p class="muted" style="margin:0;font-size:.82rem">Las alumnas con este nivel ven la fecha y el botón para entrar ${LIVE_OPEN_MIN} minutos antes. Al terminar, si agregas la grabación, la ven en esta misma clase.</p></details>`}
function curLesson(){const lv=LEVELS.find(l=>l.id===S.level);return lv.modules[S.lesson[0]].lessons[S.lesson[1]]}
function goSlide(v){const lv=LEVELS.find(l=>l.id===S.level),les=curLesson();if(!les.slides)return;
  if(v==='nextles'){S.full=0;document.body.style.overflow='';const nx=$('#next-les');nx&&nx.click();return}
  if(v==='zoom'){S.full=!S.full;document.body.style.overflow=S.full?'hidden':'';render(false);return}
  const key=lv.id+'_'+S.lesson[0]+'_'+S.lesson[1];const n=les.slides.length;let i=S.sl[key]||0;
  i=v==='next'?Math.min(n-1,i+1):v==='prev'?Math.max(0,i-1):Math.max(0,Math.min(n-1,+v));S.sl[key]=i;S.anim=1;render(false);
  const d=document.querySelector('.deck');if(d){const r=d.getBoundingClientRect();if(r.top<0)window.scrollTo({top:window.scrollY+r.top-80,behavior:'smooth'})}}
function toSec(s){if(!s||!/\d/.test(s)||/En vivo|paso/.test(s))return 0;return s.split(':').map(Number).reduce((a,b)=>a*60+b,0)}
function fmt(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function curChapter(les){let k=0;les.topics.forEach((c,i)=>{if(toSec(c.ts)<=S.t)k=i});return k}

V.comunidad=()=>{
  const chans=CM.free?CHANNELS.filter(c=>CM.freeChannels.includes(c.id)):CHANNELS;

  const canWrite=!CM.free||S.ch==='presentaciones';

    <div style="display:grid;gap:14px;min-width:0">
      ${canWrite?`<form class="card composer" id="composer"><div class="top">${av({ini:ME.ini,c:ME.c,photo:ME.photo},1)}<textarea id="post-in" placeholder="Comparte algo en # ${ch.name}" aria-label="Nueva publicación"></textarea></div>
        <div class="act"><span class="muted" style="font-size:.78rem">Publicas como ${esc(ME.name)}</span><button class="btn btn-primary btn-sm">Publicar</button></div></form>`:''}
      <div class="feed">${list.length?list.map(p=>`<article class="card post"><div class="post-h">${av(p)}<div><b>${esc(p.who)}</b>${p.karen?'<span class="tag-k">Maestra Holística</span>':''}<small>${p.when} · # ${ch.name}</small></div></div><p>${esc(p.txt)}</p>
        <div class="post-a"><button aria-pressed="${!!p.liked}" data-like="${p.i}"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>${p.likes}</button><button data-focus-reply="${p.i}"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>${p.replies.length} respuestas</button>${(p.mine||CM.isAdmin)?`<button data-delpost="${p.id}" style="margin-left:auto">Eliminar</button>`:''}</div>
        ${p.replies.length?`<div class="replies">${p.replies.map(r=>`<div class="q">${av(r)}<div class="bubble"><b>${esc(r.who)}</b>${r.karen?'<span class="tag-k">Maestra</span>':''}<p>${esc(r.txt)}</p></div></div>`).join('')}</div>`:''}
        ${canWrite?`<form class="reply-form" data-reply="${p.i}"><input type="text" id="r${p.i}" placeholder="Responder" aria-label="Responder"><button class="btn btn-ghost btn-sm">Enviar</button></form>`:''}</article>`).join(''):`<div class="card empty">Este canal se abre cuando comience el nivel. Mientras tanto, conversa en # General.</div>`}</div>

/* ---------- render + events ---------- */
let timer;
// Secciones cerradas por ahora para las alumnas (la Maestra sí entra)
const LOCKED_VIEWS=['recursos'];
const isLockedView=v=>LOCKED_VIEWS.includes(v)&&!CM.isAdmin;
const LOCK_SVG='<svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function render(scrollTop=true){
  if(isLockedView(S.view))S.view='inicio';
  $('#nav').innerHTML=NAV.filter(x=>x[0]!=='maestra'||CM.isAdmin).map(([k,n,ic,c])=>`${k==='maestra'?'<span class="nav-label">Solo para la Maestra</span>':''}<button data-go="${k}" ${isLockedView(k)?'class="locked" aria-disabled="true" title="Próximamente"':''} ${(S.view===k||(S.view==='curso'&&k==='formacion'))?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ic}</svg>${n}${isLockedView(k)?LOCK_SVG:''}${c?`<span class="count">${c}</span>`:''}</button>`).join('');
  $('#view').innerHTML=(CM.blocked?`<div class="alert"><div><b>Tu acceso está pausado</b><p>La Maestra pausó tu acceso a las clases. Escríbenos desde Ayuda si tienes dudas.</p></div></div>`:'')+(S.overdue&&S.view!=='maestra'?`<div class="alert"><div><b>Tu cuota está pendiente</b><p>Tu acceso a clases, grabaciones y materiales está pausado. Se reactiva apenas se registre el pago.</p></div><button class="btn btn-sm" data-checkout="portal">Actualizar mi pago</button></div>`:'')+V[S.view]();
  if(scrollTop)window.scrollTo(0,0);
  bindView();if(typeof pndMount==='function')pndMount();
}
function go(v){if(v==='maestra'){location.href='admin.html';return}if(isLockedView(v)){toast('Los recursos estarán disponibles muy pronto.');closeSide();return}S.view=v;stopPlay();closeSide();render()}
function openLevel(id){const lv=LEVELS.find(l=>l.id===id);S.level=id;let pos=[0,0];
  outer:for(let i=0;i<lv.modules.length;i++)for(let j=0;j<lv.modules[i].lessons.length;j++){if(!lv.modules[i].lessons[j].done){pos=[i,j];break outer}}
  S.lesson=pos;S.tab='temas';S.t=0;stopPlay();S.view='curso';closeSide();render()}
function stopPlay(){S.playing=false;clearInterval(timer)}
function bindView(){
  const play=()=>{const lv=LEVELS.find(l=>l.id===S.level);const les=lv.modules[S.lesson[0]].lessons[S.lesson[1]];const dur=toSec(les.len);
    S.playing=!S.playing;clearInterval(timer);
    if(S.playing)timer=setInterval(()=>{S.t=Math.min(dur,S.t+dur/90);updPlayer(les,dur);if(S.t>=dur){stopPlay();render(false)}},500);
    render(false)};
  $('#play')&&($('#play').onclick=play);$('#play2')&&($('#play2').onclick=play);
  const tr=$('#track');if(tr)tr.onclick=e=>{const r=tr.getBoundingClientRect();const lv=LEVELS.find(l=>l.id===S.level);const les=lv.modules[S.lesson[0]].lessons[S.lesson[1]];S.t=(e.clientX-r.left)/r.width*toSec(les.len);render(false)};
  const n=$('#notes');if(n){n.oninput=()=>{CM.notes[lkey()]=n.value};$('#save-notes').onclick=()=>CM.saveNote(lkey(),n.value).then(()=>toast('Notas guardadas')).catch(fail)}
  const qf=$('#qa-form');if(qf)qf.onsubmit=e=>{e.preventDefault();const v=$('#qa-in').value.trim();if(!v)return;CM.ask(lkey(),v).then(()=>{render(false);toast('Pregunta enviada a la Maestra Holística')}).catch(fail)};
  const md=$('#mark-done');if(md)md.onclick=()=>{const lv=LEVELS.find(l=>l.id===S.level);const les=lv.modules[S.lesson[0]].lessons[S.lesson[1]];const nv=!les.done;md.disabled=true;CM.setDone(lkey(),nv).then(()=>{les.done=nv;refreshDerived();render(false);toast(nv?'Clase marcada como vista':'Clase marcada como no vista')}).catch(e=>{md.disabled=false;fail(e)})};
  const nx=$('#next-les');if(nx)nx.onclick=()=>{const lv=LEVELS.find(l=>l.id===S.level);let [i,j]=S.lesson;j++;if(j>=lv.modules[i].lessons.length){i++;j=0}if(i>=lv.modules.length){toast('Terminaste las clases de este nivel');return}S.lesson=[i,j];S.openMods[lv.id+i]=true;S.t=0;stopPlay();render()};
  const cp=$('#composer');if(cp)cp.onsubmit=e=>{e.preventDefault();const v=$('#post-in').value.trim();if(!v)return;CM.post(S.ch,v).then(()=>{$('#post-in').value='';toast('Publicado')}).catch(fail)};
  document.querySelectorAll('form[data-reply]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const inp=f.querySelector('input');const v=inp.value.trim();if(!v)return;CM.reply(f.dataset.reply,v,(POSTS.find(p=>p.id===f.dataset.reply)||{}).ch||S.ch).then(()=>{inp.value=''}).catch(fail)});
  const rl=$('#rlvl');if(rl)rl.onchange=()=>{S.resLvl=rl.value;render(false)};
  const rq=$('#rq');if(rq)rq.oninput=()=>{S.resQ=rq.value;const pos=rq.selectionStart;render(false);const r2=$('#rq');r2.focus();r2.setSelectionRange(pos,pos)};
  const tk=$('#ticket');if(tk)tk.onsubmit=e=>{e.preventDefault();const m=$('#tk-msg').value.trim();if(!m){toast('Escribe tu mensaje antes de enviarlo');return}CM.ticket($('#tk-topic').value,m).then(()=>{S.sent=true;render(false);toast('Mensaje enviado')}).catch(fail)};
  const sq=$('#sq');if(sq)sq.oninput=()=>{const q=sq.value.toLowerCase().trim();if(!q){render(false);return}const hits=Object.values(FAQ).flatMap(v=>v.q).filter(([a,b])=>(a+b).toLowerCase().includes(q));$('#faq').innerHTML=hits.length?hits.map(([a,b])=>`<details open><summary>${a}</summary><p>${b}</p></details>`).join(''):'<p class="muted" style="padding:14px 4px">No encontramos respuestas. Escríbenos con el formulario.</p>'};
  const lf=$('#live-form');if(lf){lf.onsubmit=e=>{e.preventDefault();const k=keyLesson(lf.dataset.key);const start=new Date($('#lv-start').value);const url=$('#lv-url').value.trim(),rec=$('#lv-rec').value.trim();
      if(isNaN(start))return toast('Indica la fecha y la hora de la clase');if((url&&!isHttps(url))||(rec&&!isHttps(rec)))return toast('Los enlaces deben empezar con https://');
      CM.saveLive(lf.dataset.key,{level:+lf.dataset.level,title:k?k.les.t:'Clase en vivo',start,durationMin:Math.max(15,Math.min(600,+$('#lv-dur').value||90)),url,recordingUrl:rec}).then(()=>{render(false);toast('Clase en vivo guardada')}).catch(fail)};
    const ld=$('#lv-del');if(ld)ld.onclick=()=>{if(confirm('¿Quitar la clase en vivo de esta lección?'))CM.deleteLive(lf.dataset.key).then(()=>{render(false);toast('Clase en vivo quitada')}).catch(fail)}}
  document.querySelectorAll('form[data-answer]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const q=CM.pending[+f.dataset.answer];const v=f.querySelector('textarea').value.trim();if(!q||!v)return;const k=keyLesson(q.lessonKey);
    f.querySelector('button').disabled=true;CM.answer(q,v,k?k.les.t:'tu clase').then(()=>{render(false);toast('Respuesta enviada')}).catch(e=>{f.querySelector('button').disabled=false;fail(e)})});
  const wv=$('#wv-form');if(wv)wv.onsubmit=e=>{e.preventDefault();const u=$('#wv-url').value.trim();if(u&&!isHttps(u))return toast('El enlace debe empezar con https://');CM.saveConfig({welcomeVideo:u}).then(()=>{render(false);toast('Video de bienvenida guardado')}).catch(fail)};
  const cv=$('#cert-preview');if(cv)cv.onclick=certModal;
  const ap=$('#apply');if(ap)ap.onsubmit=e=>{e.preventDefault();S.applied=true;render();toast('Postulación enviada a Karen')};
  const ar=$('#app-reset');if(ar)ar.onclick=()=>{S.applied=false;render(false)};
}
function updPlayer(les,dur){const f=$('#tfill');if(!f)return;f.style.width=S.t/dur*100+'%';$('#tnow').textContent=fmt(S.t);const c=$('#chap-now');if(c&&les.topics.length)c.textContent=les.topics[curChapter(les)].t;
  document.querySelectorAll('.chapters li').forEach((li,i)=>li.classList.toggle('now',i===curChapter(les)))}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.go)go(d.go);
  else if(d.openLevel)openLevel(d.openLevel);
  else if(d.openLesson){const [id,i,j]=d.openLesson.split(',');S.level=id;S.lesson=[+i,+j];S.view='curso';S.tab='temas';S.t=0;stopPlay();render()}
  else if(d.les){if(t.getAttribute('aria-disabled')){toast('Esta clase se abre al completar el nivel anterior');return}S.lesson=d.les.split(',').map(Number);S.t=0;S.tab='temas';stopPlay();render(false);if(innerWidth<1100)window.scrollTo({top:0,behavior:'smooth'})}
  else if(d.slide!==undefined)goSlide(d.slide);
  else if(d.mod){const lv=S.level;const k=lv+d.mod;const cur=t.getAttribute('aria-expanded')==='true';S.openMods[k]=!cur;render(false)}
  else if(d.tab){S.tab=d.tab;render(false)}
  else if(d.seek){S.t=+d.seek;if(!S.playing){S.playing=false;$('#play')&&$('#play').click()}else render(false)}
  else if(d.toast)toast(d.toast);
  else if(d.checkout)checkout(d.checkout,t);
  else if(d.badge)badgeModal(d.badge);
  else if(d.ch){S.ch=d.ch;render(false)}
  else if(d.like){t.disabled=true;CM.toggleLike(d.like).catch(e=>{t.disabled=false;fail(e)})}
  else if(d.delpost){if(confirm('¿Eliminar esta publicación?'))CM.deletePost(d.delpost).catch(fail)}
  else if(d.focusReply){const i=$('#r'+d.focusReply);i&&i.focus()}
  else if(d.rtype){S.resType=d.rtype;render(false)}
  else if(d.topic){S.supTopic=d.topic;render(false)}
});

  <p>${b.earned?`Obtenida el ${b.earned} al completar todas las clases y la práctica final. Otorgada por la Maestra Holística, Casa Muladhara.`:`Se obtiene al completar ${lv.title}${b.lvl===4?' en esta especialización':''} y su práctica final.`}</p>
  <div class="acts">${b.earned?`<button class="btn btn-primary btn-sm" data-toast="Aquí se comparte en Instagram, Facebook o LinkedIn">Compartir</button><button class="btn btn-ghost btn-sm" data-toast="Enlace de verificación copiado">Copiar enlace de verificación</button>`:`<button class="btn btn-primary btn-sm" data-open-level="${lv.id}">Ver el nivel</button>`}</div></div>`)}
